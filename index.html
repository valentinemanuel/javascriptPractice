<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="An interactive visualizer for 12 classic data structures, built with vanilla JavaScript.">
    <title>StructLab — Interactive Data Structures Visualizer</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
          <rect class="brand-badge" x="0" y="0" width="32" height="32" rx="8" />
          <g class="brand-links">
            <path d="M9 9 L23 16 M9 9 L9 23 M9 23 L23 16" />
          </g>
          <g class="brand-nodes">
            <circle cx="9" cy="9" r="3.2" />
            <circle cx="23" cy="16" r="3.2" />
            <circle cx="9" cy="23" r="3.2" />
          </g>
        </svg>
        <div class="brand-copy">
          <h1>StructLab</h1>
        </div>
        <div class="header-badges">
          <span class="header-badge"><span id="header-structure-count">12</span> Structures</span>
          <span class="header-badge">Vanilla JS</span>
        </div>
      </div>
      <div class="top-actions">
        <button id="random-data" type="button" aria-label="Load random data into the current structure">⚄ Random data</button>
        <button id="theme-toggle" type="button" aria-label="Toggle color theme">☾ Dark</button>
      </div>
    </header>

    <main class="layout">
      <aside class="sidebar" aria-label="Structure list">
        <h2>Structures <span id="structure-count" class="count-badge"></span></h2>
        <p class="sidebar-hint">Pick a structure, then run an operation to watch it step by step.</p>
        <nav id="structure-nav"></nav>
      </aside>

      <section class="stage-panel">
        <div class="stage-header">
          <div class="stage-kicker">VISUALIZATION</div>
          <h2 id="structure-title">Loading…</h2>
          <p id="structure-description"></p>
          <p class="stage-hint">Use <strong>Play</strong> to animate, <strong>Step</strong> to advance one move at a time.</p>
        </div>

        <div class="viewer-tools" aria-label="Viewer controls">
          <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
          <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
          <button id="reset-zoom" type="button" aria-label="Reset zoom and pan">Reset view</button>
        </div>

        <div class="stage-wrap">
          <svg id="stage" role="img" aria-label="Data structure visualization"></svg>
        </div>

        <div id="controls" class="controls">
          <div id="fields" class="fields" aria-label="Operation arguments"></div>
          <div id="operation-buttons" class="button-row" aria-label="Operations"></div>
          <details id="config-details" class="config-details" hidden>
            <summary>Strategy &amp; hash settings</summary>
            <div id="configuration-buttons" class="button-row"></div>
          </details>
          <div class="playback">
            <button id="play-pause" type="button">▶ Play</button>
            <button id="step" type="button">⏭ Step</button>
            <button id="reset" type="button">↺ Reset</button>
            <label class="speed-field" for="speed">
              Speed
              <input id="speed" type="range" min="0.25" max="4" step="0.25" value="1">
              <span id="speed-value">1×</span>
            </label>
          </div>
        </div>
      </section>

      <aside class="info-panel" aria-label="Details">
        <div class="info-heading">
          <h2>Complexity</h2>
          <button id="complexity-toggle" type="button" aria-expanded="false">Show all</button>
        </div>
        <div id="complexity"></div>
        <div class="info-heading log-heading"><h2>Activity log</h2></div>
        <ol id="log" aria-live="polite"></ol>
      </aside>
    </main>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
