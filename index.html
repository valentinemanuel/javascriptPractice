<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="An interactive visualizer for data structures built with vanilla JavaScript.">
    <title>estructura — Data Structures Visualizer</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true">◈</span>
        <h1>estructura</h1>
        <span class="tagline">Data structures, step by step</span>
      </div>
      <div class="top-actions">
        <button id="theme-toggle" type="button" aria-label="Toggle color theme">☾ Dark</button>
        <button id="reset-zoom" type="button" aria-label="Reset zoom and pan">Reset view</button>
      </div>
    </header>

    <main class="layout">
      <aside class="sidebar" aria-label="Structure list">
        <h2>Structures</h2>
        <nav id="structure-nav"></nav>
      </aside>

      <section class="stage-panel">
        <div class="stage-header">
          <h2 id="structure-title">Loading…</h2>
          <p id="structure-description"></p>
        </div>

        <div class="stage-wrap">
          <svg id="stage" role="img" aria-label="Data structure visualization"></svg>
        </div>

        <div class="controls">
          <div id="fields" class="fields" aria-label="Operation arguments"></div>
          <div id="operation-buttons" class="button-row" aria-label="Operations"></div>
          <div class="playback">
            <button id="play-pause" type="button">▶ Play</button>
            <button id="step" type="button">⏭ Step</button>
            <button id="reset" type="button">↺ Reset</button>
            <label class="speed-field" for="speed">
              Speed
              <input id="speed" type="range" min="0.25" max="4" step="0.25" value="1">
              <span id="speed-value">1×</span>
            </label>
          </div>
        </div>
      </section>

      <aside class="info-panel" aria-label="Details">
        <h2>Complexity</h2>
        <div id="complexity"></div>
        <h2>Log</h2>
        <ol id="log" aria-live="polite"></ol>
      </aside>
    </main>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
